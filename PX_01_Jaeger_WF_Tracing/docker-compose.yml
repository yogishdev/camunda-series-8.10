version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disabled for local development simplicity
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g" # Allocates 1GB JVM memory
      - action.auto_create_index=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9201:9201"
    networks:
      - jaeger-elastic-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9201/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest # 'contrib' version includes the Elasticsearch exporter
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver (Spring Boot apps send data here)
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - jaeger-elastic-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9201
      # Tells Jaeger which index patterns to look for since OTel Collector writes to standard OpenTelemetry indices
      - ES_INDEX_PREFIX=open-telemetry-
    ports:
      - "16686:16686" # Jaeger Web UI (Open this in your browser to view traces)
    networks:
      - jaeger-elastic-net
    depends_on:
      elasticsearch:
        condition: service_healthy

networks:
  jaeger-elastic-net:
    driver: bridge
